<!doctype html>
<!--
  SPA 入口 HTML。
  意图：给 Vue 应用一个挂载点，并声明品牌图标与基础 meta。
  流转：浏览器请求 / → 后端（go:embed）返回本文件 → 加载 /assets/*.js 启动应用。
  扩展：新增全局 meta（如统计脚本）请在此处追加，勿在前端代码里动态注入。
  主题：站点采用透明亮色主题，因此 html 不带 dark 类，
        theme-color 取页面底色的浅冷调，移动端地址栏与页面融为一体。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提：
         不加它，样式中所有安全区变量的值恒为 0，刘海屏上下会被系统 UI 遮挡。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#f4f8fc" />
    <!--
      自托管字体（Google Fonts）：Source Sans 3（正文）+ Source Serif 4（标题）。
      为什么用 preconnect + 两段式加载：字体 CSS 与字体文件分属两个域，
      先建立连接可省一次 DNS+TLS 往返；display=swap 保证字体加载期间
      文字先用回退字体渲染（不白屏、不阻塞首帧）。
      中文回退到系统字体（PingFang / 微软雅黑）：中文字体体积大，不自托管，
      标题的衬线感由 Source Serif 4 承担，中文标题回退到黑体仍是可接受的设计。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
    />
    <!--
      基础 SEO 三件套：描述说清「是什么、给谁用」，keywords 覆盖主要检索词，
      canonical 先给相对路径兜底（后端注入时会替换成含域名的绝对地址）。
    -->
    <meta
      name="description"
      content="AQUA-API 是自托管的 LLM API 网关：统一接入模型渠道与 OpenAI / Anthropic / Gemini 兼容协议，提供路由、计费、额度与运营能力，支持私有化部署。"
    />
    <meta name="keywords" content="LLM API 网关,大模型 API,OpenAI 兼容,Anthropic,Gemini,自托管" />
    <link rel="canonical" href="/" />

    <!--
      ⚠️ 下面那对 aqua:seo 标记是「后端注入的锚点」，禁止删除，也不要往中间塞自己的内容。
      意图：SPA 只有这一个 index.html，后端在返回它时会把标记 start 与 end 之间的
            整块内容，替换成按后台「SEO 与站点收录」配置生成的 meta 标签
            （keywords、必应 / Google / 百度收录码、geo 信息、canonical）。
      为什么用标记块而不是直接写死：写死就无法按不同部署实例配置；
            用一对固定标记，后端才能稳定定位并整块替换。
      为什么默认写死 msvalidate.01：这是兜底 —— 即使后端未注入（例如直接跑未配置的实例），
            页面上也一定带着必应收录码，满足「每个页面都要有这个标记」的要求。
      为什么放在这一个文件即可：前端是 SPA，/admin/*、/console/* 等所有路由最终
            都由这一个 index.html 渲染，因此在此处加一次即覆盖全站。
      如果删掉标记：后端找不到锚点会原样返回（不会报错，但后台配置就完全失效了）。
    -->
    <!--aqua:seo:start-->
    <meta name="msvalidate.01" content="1B0EEE739DC3DB2ACD026924B711EC01" />
    <!--aqua:seo:end-->

    <title>AQUA-API</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
